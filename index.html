<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Nail Studio</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #c2185b;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(216, 27, 96, 0.12);
            padding: 28px 24px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }

        .prof-name {
            text-align: center;
            color: var(--primary-dark);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            width: 100%;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #047857;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Agende seu Horário</h2>
    <div class="prof-name" id="prof-title">Nail Studio</div>

    <div id="error-msg" class="alert-error"></div>
    <div id="success-msg" class="alert-success"></div>

    <form id="booking-form">
        <div class="form-group">
            <label for="client-name">👤 Seu Nome Completo</label>
            <input type="text" id="client-name" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="client-phone">📱 Seu WhatsApp</label>
            <input type="tel" id="client-phone" required placeholder="(83) 9XXXX-XXXX">
        </div>

        <div class="form-group">
            <label for="client-service">✨ Selecione o Serviço</label>
            <select id="client-service" required>
                <option value="">Carregando serviços...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="client-datetime">📅 Data e Horário</label>
            <input type="datetime-local" id="client-datetime" required>
        </div>

        <button type="submit" class="btn-submit">Confirmar Agendamento</button>
    </form>
</div>

<script>
    let currentProf = null;

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function showMsg(text, isError = false) {
        const errorEl = document.getElementById('error-msg');
        const successEl = document.getElementById('success-msg');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (isError) {
            errorEl.innerText = text;
            errorEl.style.display = 'block';
        } else {
            successEl.innerText = text;
            successEl.style.display = 'block';
        }
    }

    // CARREGA DADOS DO PROFISSIONAL E MONTA O SELECT
    function init() {
        const profId = getQueryParam('prof');
        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        const selectService = document.getElementById('client-service');

        if (profId) {
            currentProf = professionals.find(p => p.id === profId);
        }

        // Se não encontrou por ID ou acessou sem link, pega o primeiro cadastrado
        if (!currentProf && professionals.length > 0) {
            currentProf = professionals[0];
        }

        if (currentProf) {
            document.getElementById('prof-title').innerText = `Profissional: ${currentProf.name}`;
            
            if (currentProf.services && currentProf.services.length > 0) {
                // CORREÇÃO DO [object Object]: extrai o .name e .price corretamente
                selectService.innerHTML = '<option value="">Selecione um serviço...</option>' + 
                    currentProf.services.map(s => {
                        const name = typeof s === 'object' ? s.name : s;
                        const priceNum = typeof s === 'object' ? parseFloat(s.price || 0) : 0;
                        const priceFormatted = priceNum > 0 ? ` - R$ ${priceNum.toFixed(2).replace('.', ',')}` : '';
                        
                        return `<option value="${name}" data-price="${priceNum}">${name}${priceFormatted}</option>`;
                    }).join('');
            } else {
                selectService.innerHTML = '<option value="">Nenhum serviço disponível</option>';
            }
        } else {
            document.getElementById('prof-title').innerText = "Nenhum profissional encontrado";
            selectService.innerHTML = '<option value="">Cadastre um profissional no painel primeiro</option>';
        }
    }

    // REGISTRA O AGENDAMENTO
    document.getElementById('booking-form').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!currentProf) {
            showMsg('Erro ao identificar o profissional.', true);
            return;
        }

        const name = document.getElementById('client-name').value.trim();
        const phone = document.getElementById('client-phone').value.trim();
        const serviceSelect = document.getElementById('client-service');
        const serviceName = serviceSelect.value;
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        const price = parseFloat(selectedOption.getAttribute('data-price') || 0);
        const datetime = document.getElementById('client-datetime').value;

        if (!serviceName) {
            showMsg('Por favor, selecione um serviço.', true);
            return;
        }

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');

        const newAppointment = {
            id: 'app_' + Date.now(),
            profId: currentProf.id,
            client: name,
            phone: phone,
            service: serviceName,
            price: price,
            datetime: datetime,
            status: 'pending'
        };

        appointments.push(newAppointment);
        localStorage.setItem('nail_appointments', JSON.stringify(appointments));

        showMsg('✨ Agendamento realizado com sucesso! Aguardamos você.');
        document.getElementById('booking-form').reset();
    });

    init();
</script>
</body>
</html>
