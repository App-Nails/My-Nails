<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Studio de Unhas</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #c2185b;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(216, 27, 96, 0.12);
            padding: 24px 20px;
            margin-top: 10px;
            margin-bottom: 20px;
            overflow: hidden; /* Evita estouro de elementos */
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* CARD DO ENDEREÇO */
        .location-card {
            background: #fff0f5;
            border: 1px solid #ffe4e6;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }

        .location-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #9f1239;
            margin-bottom: 2px;
        }

        .location-address {
            font-size: 0.88rem;
            color: #475569;
            line-height: 1.3;
            margin-left: 24px;
        }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            text-decoration: none;
            margin-top: 8px;
            margin-left: 24px;
            transition: all 0.2s;
        }

        .btn-map:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
            width: 100%;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        /* CORREÇÃO DO TAMANHO DA DATA E DEMAIS INPUTS */
        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: 48px;
            padding: 0 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: #334155;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            box-sizing: border-box;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c334155' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        /* AJUSTE ESPECÍFICO PARA O INPUT DE DATA NO IOS */
        input[type="date"] {
            display: block;
            position: relative;
            line-height: 48px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .slot-btn {
            height: 42px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot-btn:hover {
            border-color: var(--primary);
        }

        .slot-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .slot-btn.disabled {
            background: #f1f5f9;
            color: #cbd5e1;
            border-color: #e2e8f0;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        button.btn-submit {
            width: 100%;
            height: 50px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.2);
        }

        button.btn-submit:active {
            background: var(--primary-dark);
        }

        .hidden { display: none !important; }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #047857;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="prof-name-title">Agendamento de Horário</h1>
    </div>

    <div id="error-msg" class="alert-error"></div>
    <div id="success-msg" class="alert-success"></div>

    <!-- LOCAL DO ESTABELECIMENTO -->
    <div class="location-card" id="location-card">
        <div class="location-header">
            <span>📍 Endereço do Local:</span>
        </div>
        <div class="location-address" id="location-text">
            Carregando endereço...
        </div>
        <a id="btn-open-map" href="#" target="_blank" class="btn-map hidden">
            🗺️ Abrir no Mapa
        </a>
    </div>

    <form id="booking-form">
        <div class="form-group">
            <label for="client-name">👤 Seu Nome Completo</label>
            <input type="text" id="client-name" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="client-phone">📱 Seu WhatsApp</label>
            <input type="tel" id="client-phone" required placeholder="(83) 9XXXX-XXXX">
        </div>

        <div class="form-group">
            <label for="service-select">✨ Selecione o Serviço</label>
            <select id="service-select" required onchange="updatePriceDisplay()">
                <!-- Opções inseridas dinamicamente -->
            </select>
        </div>

        <div class="form-group">
            <label for="booking-date">📅 Data do Agendamento</label>
            <input type="date" id="booking-date" required onchange="loadAvailableSlots()">
        </div>

        <div class="form-group">
            <label>⏰ Horários Disponíveis</label>
            <div id="slots-container" class="slots-grid">
                <!-- Horários preenchidos dinamicamente -->
            </div>
        </div>

        <button type="submit" class="btn-submit">Confirmar Agendamento</button>
    </form>
</div>

<script>
    let currentProf = null;
    let selectedTimeSlot = null;

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function showError(msg) {
        const err = document.getElementById('error-msg');
        err.innerText = msg;
        err.style.display = 'block';
    }

    function hideError() {
        document.getElementById('error-msg').style.display = 'none';
    }

    function loadProfessional() {
        const profId = getQueryParam('prof');
        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');

        if (profId) {
            currentProf = professionals.find(p => p.id === profId);
        } else if (professionals.length > 0) {
            currentProf = professionals[0];
        }

        if (!currentProf) {
            showError("Profissional não encontrado! Verifique o link enviado.");
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('location-card').style.display = 'none';
            return;
        }

        setupLocationInfo();

        const serviceSelect = document.getElementById('service-select');
        const services = currentProf.services || [
            { name: "Manicure Tradicional", price: 35 },
            { name: "Esmaltação em Gel", price: 60 },
            { name: "Alongamento", price: 120 }
        ];

        serviceSelect.innerHTML = '<option value="" disabled selected>Selecione um serviço...</option>' + 
            services.map(s => `
                <option value="${s.name}" data-price="${s.price}">
                    ${s.name} - R$ ${parseFloat(s.price).toFixed(2).replace('.', ',')}
                </option>
            `).join('');

        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('booking-date');
        dateInput.min = today;

        loadAvailableSlots();
    }

    function setupLocationInfo() {
        const locText = document.getElementById('location-text');
        const mapBtn = document.getElementById('btn-open-map');

        if (currentProf.locationType === 'home' || !currentProf.address || currentProf.address === 'Atendimento a Domicílio') {
            locText.innerText = "Atendimento a Domicílio";
            mapBtn.classList.add('hidden');
        } else {
            locText.innerText = currentProf.address;
            const encodedAddress = encodeURIComponent(currentProf.address);
            mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`;
            mapBtn.classList.remove('hidden');
        }
    }

    function loadAvailableSlots() {
        const date = document.getElementById('booking-date').value;
        const slotsContainer = document.getElementById('slots-container');
        selectedTimeSlot = null;

        if (!date) {
            slotsContainer.innerHTML = '<p style="grid-column: span 3; font-size: 0.85rem; color:#94a3b8; text-align:center; padding: 10px 0;">Selecione primeiro a data...</p>';
            return;
        }

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        
        const occupiedSlots = appointments
            .filter(a => a.profId === currentProf.id && a.datetime.startsWith(date))
            .map(a => a.datetime.split('T')[1]);

        const allSlots = currentProf.availableSlots || ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];

        slotsContainer.innerHTML = allSlots.map(time => {
            const isTaken = occupiedSlots.includes(time);
            if (isTaken) {
                return `<button type="button" class="slot-btn disabled" disabled>${time}</button>`;
            }
            return `<button type="button" class="slot-btn" onclick="selectSlot(this, '${time}')">${time}</button>`;
        }).join('');
    }

    function selectSlot(btn, time) {
        document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTimeSlot = time;
        hideError();
    }

    document.getElementById('booking-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const serviceSelect = document.getElementById('service-select');
        if (!serviceSelect.value) {
            showError("Por favor, selecione um serviço.");
            return;
        }

        if (!selectedTimeSlot) {
            showError("Por favor, selecione um horário disponível.");
            return;
        }

        const clientName = document.getElementById('client-name').value.trim();
        const clientPhone = document.getElementById('client-phone').value.trim();
        const serviceName = serviceSelect.value;
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        const price = parseFloat(selectedOption.getAttribute('data-price')) || 0;
        const date = document.getElementById('booking-date').value;

        const newAppointment = {
            id: 'app_' + Date.now(),
            profId: currentProf.id,
            client: clientName,
            phone: clientPhone,
            service: serviceName,
            price: price,
            datetime: `${date}T${selectedTimeSlot}`,
            status: 'pending'
        };

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        appointments.push(newAppointment);
        localStorage.setItem('nail_appointments', JSON.stringify(appointments));

        const successMsg = document.getElementById('success-msg');
        successMsg.innerText = "✨ Agendamento realizado com sucesso!";
        successMsg.style.display = 'block';

        document.getElementById('booking-form').reset();
        loadAvailableSlots();

        setTimeout(() => {
            successMsg.style.display = 'none';
        }, 4000);
    });

    loadProfessional();
</script>
</body>
</html>
