<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Nail Studio</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #c2185b;
            --surface: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 20px;
            padding: 28px 24px;
            margin-top: 20px;
        }

        h2 { color: var(--primary); text-align: center; margin-bottom: 4px; }
        .prof-name { text-align: center; color: var(--primary-dark); font-weight: 600; margin-bottom: 12px; }

        .location-info-box {
            background: #fff0f6;
            border: 1px solid #fbcfe8;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            color: #831843;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .alert-success { background: #d1fae5; color: #047857; padding: 12px; border-radius: 8px; font-size: 0.88rem; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Agende seu Horário</h2>
    <div class="prof-name" id="prof-title">Nail Studio</div>

    <!-- CAIXA DE ENDEREÇO / MENSAGEM DO LOCAL -->
    <div class="location-info-box" id="location-box">
        <span style="font-size: 1.2rem;">📍</span>
        <div>
            <strong id="location-type-label">Local de Atendimento:</strong><br>
            <span id="location-text">Carregando informações...</span>
        </div>
    </div>

    <div id="success-msg" class="alert-success"></div>

    <form id="booking-form">
        <div class="form-group">
            <label>👤 Seu Nome Completo</label>
            <input type="text" id="client-name" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label>📱 Seu WhatsApp</label>
            <input type="tel" id="client-phone" required placeholder="(83) 9XXXX-XXXX">
        </div>

        <div class="form-group">
            <label>✨ Selecione o Serviço</label>
            <select id="client-service" required></select>
        </div>

        <div class="form-group">
            <label>📅 Data do Agendamento</label>
            <input type="date" id="client-date" required onchange="updateAvailableTimes()">
        </div>

        <div class="form-group">
            <label>⏰ Horários Disponíveis</label>
            <select id="client-time" required>
                <option value="">Selecione primeiro a data...</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Confirmar Agendamento</button>
    </form>
</div>

<script>
    let currentProf = null;

    function getQueryParam(param) {
        return new URLSearchParams(window.location.search).get(param);
    }

    function init() {
        const profId = getQueryParam('prof');
        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');

        currentProf = professionals.find(p => p.id === profId) || professionals[0];

        if (currentProf) {
            document.getElementById('prof-title').innerText = `Profissional: ${currentProf.name}`;
            
            // ATUALIZA ENDEREÇO / INFORMAÇÕES DE ATENDIMENTO
            const locationTextEl = document.getElementById('location-text');
            const locationLabelEl = document.getElementById('location-type-label');

            if (currentProf.locationType === 'home') {
                locationLabelEl.innerText = "Atendimento A Domicílio:";
                locationTextEl.innerText = "A profissional vai até a sua residência no horário agendado.";
            } else {
                locationLabelEl.innerText = "Endereço do Local:";
                locationTextEl.innerText = currentProf.address || "Endereço não informado.";
            }

            // CARREGA LISTA DE SERVIÇOS
            const selectService = document.getElementById('client-service');
            selectService.innerHTML = '<option value="">Selecione um serviço...</option>' + 
                currentProf.services.map(s => {
                    const name = typeof s === 'object' ? s.name : s;
                    const price = typeof s === 'object' ? s.price : 0;
                    return `<option value="${name}" data-price="${price}">${name} - R$ ${parseFloat(price).toFixed(2).replace('.', ',')}</option>`;
                }).join('');
        }
    }

    function updateAvailableTimes() {
        const dateVal = document.getElementById('client-date').value;
        const selectTime = document.getElementById('client-time');

        if (!dateVal || !currentProf) return;

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        const occupiedTimes = appointments
            .filter(a => a.profId === currentProf.id && a.datetime.startsWith(dateVal))
            .map(a => a.datetime.split('T')[1]);

        const masterSlots = currentProf.availableSlots || ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
        const freeSlots = masterSlots.filter(slot => !occupiedTimes.includes(slot));

        if (freeSlots.length === 0) {
            selectTime.innerHTML = '<option value="">Nenhum horário livre nesta data</option>';
        } else {
            selectTime.innerHTML = '<option value="">Selecione o horário...</option>' + 
                freeSlots.map(t => `<option value="${t}">${t} hs</option>`).join('');
        }
    }

    document.getElementById('booking-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('client-name').value.trim();
        const phone = document.getElementById('client-phone').value.trim();
        const serviceSelect = document.getElementById('client-service');
        const serviceName = serviceSelect.value;
        const price = parseFloat(serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-price') || 0);
        const date = document.getElementById('client-date').value;
        const time = document.getElementById('client-time').value;

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        
        appointments.push({
            id: 'app_' + Date.now(),
            profId: currentProf.id,
            client: name,
            phone: phone,
            service: serviceName,
            price: price,
            datetime: `${date}T${time}`,
            status: 'pending'
        });

        localStorage.setItem('nail_appointments', JSON.stringify(appointments));

        document.getElementById('success-msg').innerText = '✨ Agendamento confirmado com sucesso!';
        document.getElementById('success-msg').style.display = 'block';
        document.getElementById('booking-form').reset();
    });

    init();
</script>
</body>
</html>
