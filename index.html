<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio - Agendamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_pink.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <style>
        :root {
            --primary: #d81b60;
            --surface: #ffffff;
            --text-main: #2c3e50;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 440px; background: var(--surface); border-radius: 20px; box-shadow: 0 12px 28px rgba(216, 27, 96, 0.12); padding: 32px 28px; }

        h2 { color: var(--primary); font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; background-color: #fafafa; outline: none; }
        input:focus, select:focus { border-color: var(--primary); background: #fff; }
        
        button.btn-action { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, #c2185b 100%); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Agende seu Horário</h2>
    <div id="prof-subtitle" class="subtitle">Carregando informações...</div>

    <form id="booking-form">
        <div class="form-group">
            <label for="client-name">👤 Seu Nome</label>
            <input type="text" id="client-name" required placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
            <label for="client-phone">📱 Seu WhatsApp</label>
            <input type="tel" id="client-phone" required placeholder="(83) 9XXXX-XXXX">
        </div>

        <div class="form-group">
            <label for="service-type">✨ Serviço</label>
            <select id="service-type" required>
                <option value="Alongamento em Gel">Alongamento em Gel</option>
                <option value="Manutenção">Manutenção</option>
                <option value="Esmaltação em Gel">Esmaltação em Gel</option>
                <option value="Pé e Mão">Pé e Mão</option>
            </select>
        </div>

        <div class="form-group">
            <label for="app-date-only">📅 Data</label>
            <input type="text" id="app-date-only" required placeholder="Escolha a data">
        </div>

        <div class="form-group">
            <label for="app-time-only">⏰ Horário</label>
            <input type="text" id="app-time-only" required placeholder="Escolha o horário">
        </div>

        <button type="submit" class="btn-action">Confirmar Agendamento</button>
    </form>
</div>

<script>
    flatpickr("#app-date-only", { locale: "pt", dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", minDate: "today" });
    flatpickr("#app-time-only", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, minTime: "08:00", maxTime: "19:00" });

    // Identifica o profissional pela URL
    const urlParams = new URLSearchParams(window.location.search);
    const targetProfId = urlParams.get('prof');
    const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');

    let currentProf = professionals.find(p => p.id === targetProfId);

    // Se não houver id no link ou for inválido, usa o primeiro cadastrado
    if (!currentProf && professionals.length > 0) {
        currentProf = professionals[0];
    }

    const subtitleEl = document.getElementById('prof-subtitle');
    if (currentProf) {
        subtitleEl.innerText = `Atendimento com ${currentProf.name}`;
    } else {
        subtitleEl.innerText = "Nenhum profissional cadastrado no momento.";
    }

    document.getElementById('booking-form').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!currentProf) {
            alert('Atenção: O profissional responsável ainda não cadastrou o perfil no painel!');
            return;
        }

        const clientName = document.getElementById('client-name').value;
        const clientPhone = document.getElementById('client-phone').value;
        const serviceType = document.getElementById('service-type').value;
        const dateValue = document.getElementById('app-date-only').value;
        const timeValue = document.getElementById('app-time-only').value;

        const appointment = {
            id: Date.now(),
            profId: currentProf.id,
            client: clientName,
            phone: clientPhone,
            service: serviceType,
            datetime: `${dateValue}T${timeValue}`,
            alert30Sent: false
        };

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        appointments.push(appointment);
        localStorage.setItem('nail_appointments', JSON.stringify(appointments));

        alert('Agendamento realizado com sucesso!\n\nSe precisar cancelar, cancele com 30 minutos de antecedência.');

        // Envia a mensagem no WhatsApp do profissional específico
        const msgWhatsApp = encodeURIComponent(
            `*Novo Agendamento Realizado!* 💅\n\n` +
            `*Profissional:* ${currentProf.name}\n` +
            `*Cliente:* ${clientName}\n` +
            `*WhatsApp:* ${clientPhone}\n` +
            `*Serviço:* ${serviceType}\n` +
            `*Data:* ${dateValue}\n` +
            `*Horário:* ${timeValue}\n\n` +
            `_Aviso de cancelamento com 30 min de antecedência em vigor._`
        );

        window.open(`https://wa.me/${currentProf.phone}?text=${msgWhatsApp}`, '_blank');
        this.reset();
    });
</script>
</body>
</html>
