<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Studio de Unhas</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #c2185b;
            --surface: #ffffff;
            --background: #f8bbd0;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, var(--background) 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(216, 27, 96, 0.15);
            padding: 28px 24px;
        }

        .prof-title {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            text-transform: capitalize;
        }

        .address-box {
            background: #fff0f6;
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.88rem;
        }

        .address-box strong {
            color: var(--primary-dark);
            display: block;
            margin-bottom: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #fafafa;
            -webkit-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
            color: var(--text-main);
        }

        input[type="date"] {
            color-scheme: light;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .slot-btn {
            padding: 12px 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .slot-btn.disabled {
            background: #ffebee;
            border-color: #ffcdd2;
            color: #e57373;
            text-decoration: line-through;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        .alert-box {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 15px;
            display: none;
        }

        .alert-error { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

<div class="container">
    <div id="prof-header" class="prof-title">Atendimento</div>
    
    <div id="address-container" class="address-box">
        <strong>📍 Endereço do Local:</strong>
        <span id="prof-address-display">Carregando endereço...</span>
    </div>

    <div id="alert-msg" class="alert-box"></div>

    <form id="booking-form">
        <div class="form-group">
            <label for="client-name">👤 Seu Nome Completo</label>
            <input type="text" id="client-name" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="client-phone">📱 Seu WhatsApp</label>
            <input type="tel" id="client-phone" required placeholder="(83) 9XXXX-XXXX">
        </div>

        <div class="form-group">
            <label for="service-select">✨ Selecione o Serviço</label>
            <select id="service-select" required>
                <option value="">Selecione um serviço...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="booking-date">📅 Data do Agendamento</label>
            <input type="date" id="booking-date" required>
        </div>

        <div class="form-group">
            <label>⏰ Horários para a Data Selecionada</label>
            <div id="slots-container" class="slots-grid">
                <p style="grid-column: span 3; font-size: 0.85rem; color: #666;">Carregando horários...</p>
            </div>
        </div>

        <button type="submit" class="btn-submit">Confirmar Agendamento</button>
    </form>
</div>

<script>
    // ==========================================
    // PROTEÇÃO CONTRA CTRL+U E BOTÃO DIREITO
    // ==========================================
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
            e.preventDefault();
            return false;
        }
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            return false;
        }
    });

    // ==========================================
    // LÓGICA DE AGENDAMENTO E HORÁRIOS
    // ==========================================
    let activeProf = null;
    let selectedSlot = null;

    // TODOS OS SERVIÇOS E VALORES CADASTRADOS
    const fullServicesList = [
        { name: 'Pé e Mão', price: '50.00' },
        { name: 'Apenas Mão', price: '30.00' },
        { name: 'Apenas Pé', price: '30.00' },
        { name: 'Manicure Tradicional', price: '35.00' },
        { name: 'Esmaltação em Gel', price: '60.00' },
        { name: 'Esmaltação Francesa', price: '45.00' },
        { name: 'Aplicação de Alongamento', price: '120.00' },
        { name: 'Alongamento em Gel', price: '120.00' },
        { name: 'Manutenção de Alongamento', price: '80.00' },
        { name: 'Remoção de Alongamento', price: '40.00' },
        { name: 'Nail Art', price: '25.00' }
    ];

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function loadProfessionalData() {
        const profId = getQueryParam('prof');
        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        
        if (profId) {
            activeProf = professionals.find(p => p.id === profId);
        } else if (professionals.length > 0) {
            activeProf = professionals[0];
        }

        if (!activeProf) {
            activeProf = {
                id: 'prof_default',
                name: 'Myrna',
                address: 'Atendimento a Domicílio',
                services: fullServicesList,
                availableSlots: ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"]
            };
        }

        document.getElementById('prof-header').innerText = activeProf.name;
        document.getElementById('prof-address-display').innerText = activeProf.address || "Atendimento a Domicílio";

        const serviceSelect = document.getElementById('service-select');
        serviceSelect.innerHTML = '<option value="">Selecione um serviço...</option>';

        fullServicesList.forEach(s => {
            const numPrice = parseFloat(s.price);
            const formattedPrice = numPrice.toFixed(2).replace('.', ',');

            const opt = document.createElement('option');
            opt.value = JSON.stringify(s);
            opt.innerText = `${s.name} - R$ ${formattedPrice}`;
            serviceSelect.appendChild(opt);
        });

        const dateInput = document.getElementById('booking-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        dateInput.setAttribute('min', today);

        renderTimeSlots();
    }

    function renderTimeSlots() {
        const slotsGrid = document.getElementById('slots-container');
        slotsGrid.innerHTML = '';
        selectedSlot = null;

        const selectedDate = document.getElementById('booking-date').value;
        if (!selectedDate) {
            slotsGrid.innerHTML = '<p style="grid-column: span 3; font-size: 0.85rem; color: #666;">Selecione uma data para ver os horários.</p>';
            return;
        }

        const fullGridSlots = ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
        const baseSlots = (activeProf && activeProf.availableSlots && activeProf.availableSlots.length > 0) 
            ? activeProf.availableSlots 
            : fullGridSlots;

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        const bookedSlots = appointments
            .filter(app => activeProf && app.profId === activeProf.id && app.datetime.startsWith(selectedDate))
            .map(app => app.datetime.split('T')[1]);

        baseSlots.forEach(time => {
            const btn = document.createElement('div');
            btn.className = 'slot-btn';
            btn.innerText = time;

            if (bookedSlots.includes(time)) {
                btn.classList.add('disabled');
            } else {
                btn.onclick = function() {
                    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedSlot = time;
                };
            }
            slotsGrid.appendChild(btn);
        });
    }

    document.getElementById('booking-date').addEventListener('change', renderTimeSlots);

    document.getElementById('booking-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const alertBox = document.getElementById('alert-msg');
        alertBox.style.display = 'none';

        if (!selectedSlot) {
            alertBox.className = 'alert-box alert-error';
            alertBox.innerText = 'Por favor, selecione um horário.';
            alertBox.style.display = 'block';
            return;
        }

        const name = document.getElementById('client-name').value.trim();
        const phone = document.getElementById('client-phone').value.trim();
        const serviceSelectVal = document.getElementById('service-select').value;
        
        if (!serviceSelectVal) {
            alertBox.className = 'alert-box alert-error';
            alertBox.innerText = 'Por favor, selecione um serviço.';
            alertBox.style.display = 'block';
            return;
        }

        const serviceObj = JSON.parse(serviceSelectVal);
        const date = document.getElementById('booking-date').value;

        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        
        const newAppointment = {
            id: 'app_' + Date.now(),
            profId: activeProf.id,
            client: name,
            phone: phone,
            service: serviceObj.name,
            price: serviceObj.price,
            datetime: `${date}T${selectedSlot}`,
            status: 'pending'
        };

        appointments.push(newAppointment);
        localStorage.setItem('nail_appointments', JSON.stringify(appointments));

        alertBox.className = 'alert-box alert-success';
        alertBox.innerText = 'Agendamento realizado com sucesso!';
        alertBox.style.display = 'block';

        document.getElementById('booking-form').reset();
        loadProfessionalData();
    });

    loadProfessionalData();
</script>

</body>
</html>
