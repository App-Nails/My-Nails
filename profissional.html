<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Código Corrigido sem Erros de Sintaxe -->
<script>
// Configuração Supabase
const SUPABASE_URL = 'https://zvxcakqpbrpfdsvhuhbh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_41upAZ0wW1NC4i3zTnkU9Q_gF8Tc4Ry';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Funções Utilitárias
function getDB(key) { return JSON.parse(localStorage.getItem(key)) || []; }
function setDB(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }
    return hash.toString();
}

function getLocalDateString(d = new Date()) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// Formata timestamps numéricos ou strings ISO para HH:MM (DD/MM)
function formatHorario(rawHorario) {
    if (!rawHorario) return 'Horário não informado';
    
    let dateObj;
    if (!isNaN(rawHorario)) {
        dateObj = new Date(Number(rawHorario));
    } else {
        dateObj = new Date(rawHorario);
    }

    if (isNaN(dateObj.getTime())) {
        return rawHorario;
    }

    const dia = String(dateObj.getDate()).padStart(2, '0');
    const mes = String(dateObj.getMonth() + 1).padStart(2, '0');
    const horas = String(dateObj.getHours()).padStart(2, '0');
    const minutos = String(dateObj.getMinutes()).padStart(2, '0');

    return `${horas}:${minutos} (${dia}/${mes})`;
}

// Extrai valor numérico seguro de vários formatos possíveis
function parsePriceValue(booking) {
    const valRaw = booking.preco ?? booking.valor ?? booking.price ?? 0;
    if (typeof valRaw === 'number') return valRaw;
    const cleanStr = String(valRaw).replace('R$', '').replace(',', '.').trim();
    return parseFloat(cleanStr) || 0;
}

// Navegação Segura
function navigate(viewId) {
    const views = ['pro-login-view', 'pro-dashboard-view', 'pro-register-view', 'pro-forgot-view'];
    views.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = (id === viewId) ? 'block' : 'none';
    });
}

// Autenticação
async function proLogin() {
    const phoneEl = document.getElementById('login-phone');
    const passEl = document.getElementById('login-pass');
    const phone = phoneEl ? phoneEl.value.trim() : '';
    const pass = passEl ? passEl.value.trim() : '';

    if (!phone || !pass) {
        alert('Por favor, preencha o telefone e a senha.');
        return;
    }

    const users = getDB('pro_users');
    const hashed = hashString(pass);
    const user = users.find(u => u.phone === phone && u.passHash === hashed);

    if (user) {
        localStorage.setItem('active_pro_user', phone);
        await loadProDashboard();
        navigate('pro-dashboard-view');
    } else {
        alert('Telefone ou senha incorretos!');
    }
}

function proRegister(event) {
    if (event) event.preventDefault();
    const name = document.getElementById('reg-name')?.value.trim() || '';
    const phone = document.getElementById('reg-phone')?.value.trim() || '';
    const address = document.getElementById('reg-address')?.value.trim() || '';
    const pass = document.getElementById('reg-pass')?.value.trim() || '';
    const question = document.getElementById('reg-q')?.value.trim() || '';
    const answer = document.getElementById('reg-a')?.value.trim() || '';

    let users = getDB('pro_users');
    if (users.some(u => u.phone === phone)) {
        alert('Este telefone já está cadastrado!');
        return;
    }

    users.push({
        name,
        phone,
        address,
        passHash: hashString(pass),
        question,
        answerHash: hashString(answer.toLowerCase())
    });

    setDB('pro_users', users);
    alert('Cadastro realizado com sucesso! Faça login para continuar.');
    navigate('pro-login-view');
}

function proLogout() {
    localStorage.removeItem('active_pro_user');
    navigate('pro-login-view');
}

// Recuperação de Senha
let targetUserForReset = null;

function fetchSecurityQuestion() {
    const phone = document.getElementById('reset-phone')?.value.trim() || '';
    const users = getDB('pro_users');
    targetUserForReset = users.find(u => u.phone === phone);

    if (targetUserForReset) {
        const qEl = document.getElementById('display-q');
        if (qEl) qEl.innerText = `Pergunta: ${targetUserForReset.question}`;
        
        const step2 = document.getElementById('reset-step-2');
        if (step2) step2.style.display = 'block';
    } else {
        alert('Telefone não encontrado no cadastro.');
    }
}

function executePasswordReset() {
    const answer = document.getElementById('reset-a')?.value.trim().toLowerCase() || '';
    const newPass = document.getElementById('reset-new-pass')?.value.trim() || '';

    if (!answer || !newPass) {
        alert('Preencha todos os campos!');
        return;
    }

    if (targetUserForReset && hashString(answer) === targetUserForReset.answerHash) {
        let users = getDB('pro_users');
        let idx = users.findIndex(u => u.phone === targetUserForReset.phone);
        if (idx !== -1) {
            users[idx].passHash = hashString(newPass);
            setDB('pro_users', users);
            alert('Senha alterada com sucesso!');
            navigate('pro-login-view');
        }
    } else {
        alert('Resposta de segurança incorreta!');
    }
}

// Dashboard
async function loadProDashboard() {
    try {
        const phone = localStorage.getItem('active_pro_user');
        const user = getDB('pro_users').find(u => u.phone === phone);

        if (!user) return;

        const welcomeEl = document.getElementById('welcome-user');
        if (welcomeEl) welcomeEl.innerText = `Olá, ${user.name}! Gerencie seus atendimentos e fluxo.`;
        
        const shareLinkEl = document.getElementById('pro-share-link');
        if (shareLinkEl) {
            const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            shareLinkEl.innerText = `${basePath}/cliente.html?pro=${phone}`;
        }

        const addrEl = document.getElementById('dash-address');
        if (addrEl) addrEl.value = user.address || '';

        renderSlots();
        await renderBookingsPro();
        await calculateFinances();
    } catch (err) {
        console.warn('Aviso ao carregar dashboard:', err);
    }
}

function addTimeSlot() {
    const date = document.getElementById('slot-date')?.value;
    const time = document.getElementById('slot-time')?.value;
    const phone = localStorage.getItem('active_pro_user');

    if (!date || !time) {
        alert("Selecione a data e o horário!");
        return;
    }

    let slots = getDB('slots');
    slots.push({ id: Date.now(), proPhone: phone, date, time, booked: false });
    setDB('slots', slots);

    const timeEl = document.getElementById('slot-time');
    if (timeEl) timeEl.value = '';
    renderSlots();
}

function renderSlots() {
    const phone = localStorage.getItem('active_pro_user');
    const slots = getDB('slots').filter(s => s.proPhone === phone && !s.booked);
    const list = document.getElementById('slots-list');

    if (!list) return;

    if (slots.length === 0) {
        list.innerHTML = '<li class="list-group-item text-muted py-3">Nenhum horário aberto no momento.</li>';
        return;
    }

    list.innerHTML = slots.map(s => `
        <li class="list-group-item d-flex justify-content-between align-items-center py-2">
            <span><i class="fa-regular fa-clock me-2 text-muted"></i><strong>${s.date.split('-').reverse().join('/')}</strong> às <strong>${s.time}</strong></span>
            <div>
                <button onclick="confirmSlot(${s.id})" class="btn btn-sm btn-outline-success me-1"><i class="fa-solid fa-check"></i> Confirmar</button>
                <button onclick="removeSlot(${s.id})" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i> Excluir</button>
            </div>
        </li>
    `).join('');
}

async function confirmSlot(id) {
    let slots = getDB('slots');
    let idx = slots.findIndex(s => s.id === id);
    if (idx !== -1) {
        slots[idx].booked = true;
        setDB('slots', slots);

        renderSlots();
        await renderBookingsPro();
        await calculateFinances();
    }
}

function removeSlot(id) {
    let slots = getDB('slots').filter(s => s.id !== id);
    setDB('slots', slots);
    renderSlots();
}

async function renderBookingsPro() {
    const proPhone = localStorage.getItem('active_pro_user');
    const container = document.getElementById('pro-bookings-list');

    if (!container || !proPhone) return;

    try {
        const { data: bookings, error } = await _supabase
            .from('agendamentos')
            .select('*')
            .eq('pro_id', proPhone);

        if (error) {
            container.innerHTML = '<p class="text-danger small">Erro ao carregar agendamentos do banco remoto.</p>';
            return;
        }

        if (!bookings || bookings.length === 0) {
            container.innerHTML = '<p class="text-muted">Nenhum agendamento confirmado no momento.</p>';
            return;
        }

        container.innerHTML = bookings.map(b => {
            const val = parsePriceValue(b);
            const horarioFormatado = formatHorario(b.horario);
            const clienteNome = b.nome || b.cliente_nome || 'Cliente sem nome';
            const clienteTel = b.telefone || b.cliente_telefone || 'Não informado';
            const servicoNome = b.servico || b.servico_nome || 'Atendimento';

            return `
                <div class="card mb-2 p-3 border-start border-4 border-pink shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-1 text-pink fw-bold">${clienteNome}</h5>
                        <span class="badge bg-primary fs-6"><i class="fa-regular fa-clock me-1"></i>${horarioFormatado}</span>
                    </div>
                    <p class="mb-1"><strong>Telefone:</strong> ${clienteTel}</p>
                    <p class="mb-0"><strong>Serviço:</strong> ${servicoNome} - <span class="text-success fw-bold">R$ ${val.toFixed(2)}</span></p>
                </div>
            `;
        }).join('');
    } catch (e) {
        console.warn('Erro na consulta do Supabase:', e);
    }
}

function addExpense() {
    const desc = document.getElementById('expense-desc')?.value.trim() || '';
    const val = parseFloat(document.getElementById('expense-val')?.value || 0);
    const phone = localStorage.getItem('active_pro_user');

    if (!desc || isNaN(val)) {
        alert("Preencha a descrição e o valor da despesa.");
        return;
    }

    let expenses = getDB('expenses');
    expenses.push({ proPhone: phone, desc, val, date: getLocalDateString() });
    setDB('expenses', expenses);

    const descEl = document.getElementById('expense-desc');
    const valEl = document.getElementById('expense-val');
    if (descEl) descEl.value = '';
    if (valEl) valEl.value = '';
    
    calculateFinances();
}

async function calculateFinances() {
    const phone = localStorage.getItem('active_pro_user');
    const expenses = getDB('expenses').filter(e => e.proPhone === phone);

    let bookings = [];
    try {
        const res = await _supabase
            .from('agendamentos')
            .select('*')
            .eq('pro_id', phone);
        if (res.data) bookings = res.data;
    } catch (e) {
        console.warn('Erro ao consultar finanças no Supabase:', e);
    }

    const todayStr = getLocalDateString();
    const monthStr = todayStr.substring(0, 7);

    let dayIn = 0, dayOut = 0, monthIn = 0, monthOut = 0, monthCount = 0;

    if (bookings) {
        bookings.forEach(b => {
            const price = parsePriceValue(b);
            let bDate = "";
            
            if (b.horario) {
                let d = !isNaN(b.horario) ? new Date(Number(b.horario)) : new Date(b.horario);
                if (!isNaN(d.getTime())) {
                    bDate = getLocalDateString(d);
                }
            }

            if (bDate === todayStr) {
                dayIn += price;
            }
            if (bDate.startsWith(monthStr)) {
                monthIn += price;
                monthCount++;
            }
        });
    }

    expenses.forEach(e => {
        if (!e.date) return;
        const eVal = parseFloat(String(e.val || 0).replace(',', '.')) || 0;
        if (e.date.startsWith(todayStr)) dayOut += eVal;
        if (e.date.startsWith(monthStr)) monthOut += eVal;
    });

    const dayInEl = document.getElementById('fin-day-in');
    const dayOutEl = document.getElementById('fin-day-out');
    const monthTotalEl = document.getElementById('fin-month-total');
    const monthCountEl = document.getElementById('fin-month-count');

    if (dayInEl) dayInEl.innerText = `R$ ${dayIn.toFixed(2)}`;
    if (dayOutEl) dayOutEl.innerText = `R$ ${dayOut.toFixed(2)}`;
    if (monthTotalEl) monthTotalEl.innerText = `R$ ${(monthIn - monthOut).toFixed(2)}`;
    if (monthCountEl) monthCountEl.innerText = monthCount;
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    const activeUser = localStorage.getItem('active_pro_user');
    if (activeUser) {
        loadProDashboard();
        navigate('pro-dashboard-view');
    } else {
        navigate('pro-login-view');
    }
});
</script>
