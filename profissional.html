<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio - Painel Profissional</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-light: #f48fb1;
            --bg: #fce4ec;
            --surface: #ffffff;
            --text: #333333;
            --danger: #e53935;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: var(--surface); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; }

        h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
        
        .appointment-card { background: #fff5f8; border-left: 4px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .appointment-info strong { color: var(--primary); display: block; }
        .time-tag { display: inline-block; background: var(--primary-light); padding: 2px 8px; border-radius: 12px; font-size: 0.8em; margin-top: 5px; }
        
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .empty-msg { text-align: center; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Agenda da Designer</h2>
    <div id="appointments-list">
        <!-- Agendamentos renderizados via JS -->
    </div>
</div>

<script>
    // Solicitar permissão de notificação (alerta de 10 minutos)
    if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    // Renderiza a lista de agendamentos
    function renderAppointments() {
        const list = document.getElementById('appointments-list');
        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        
        appointments.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

        if (appointments.length === 0) {
            list.innerHTML = '<p class="empty-msg">Nenhum horário agendado no momento.</p>';
            return;
        }

        list.innerHTML = appointments.map(app => {
            const dateObj = new Date(app.datetime);
            const formattedDate = dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            return `
                <div class="appointment-card">
                    <div class="appointment-info">
                        <strong>${app.client}</strong>
                        <span>${app.service}</span><br>
                        <span class="time-tag">📅 ${formattedDate}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteAppointment(${app.id})">Cancelar</button>
                </div>
            `;
        }).join('');
    }

    function deleteAppointment(id) {
        if (confirm('Deseja realmente remover este agendamento?')) {
            let appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
            appointments = appointments.filter(app => app.id !== id);
            localStorage.setItem('nail_appointments', JSON.stringify(appointments));
            renderAppointments();
        }
    }

    // Verificação de alerta da Profissional (10 min antes)
    setInterval(() => {
        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        const now = new Date().getTime();

        appointments.forEach(app => {
            const appTime = new Date(app.datetime).getTime();
            const diffMinutes = (appTime - now) / (1000 * 60);

            if (diffMinutes > 0 && diffMinutes <= 10 && !app.alert10Sent) {
                sendNotification("Atendimento Próximo", `Sua cliente ${app.client} chega em 10 minutos para ${app.service}.`);
                app.alert10Sent = true;
            }
        });

        localStorage.setItem('nail_appointments', JSON.stringify(appointments));
        renderAppointments();
    }, 10000);

    function sendNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body });
        } else {
            alert(`${title}\n${body}`);
        }
    }

    // Carregar agendamentos na inicialização
    renderAppointments();

    // Bloqueios de inspeção de código
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
            (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
</script>
</body>
</html>
