<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Profissional - Nail Studio</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #c2185b;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(216, 27, 96, 0.12);
            padding: 28px 24px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h2 { color: var(--primary); font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 6px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; }

        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 4px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        .form-group { margin-bottom: 14px; width: 100%; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            background-color: #fafafa;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); background: #fff; }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 6px;
            margin-bottom: 10px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        button.btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-link {
            background: none; border: none; color: var(--primary);
            font-weight: 600; font-size: 0.85rem; cursor: pointer;
            text-decoration: underline; margin-top: 10px; display: block; width: 100%; text-align: center;
        }

        .hidden { display: none; }

        .card {
            background: #fff3f8; border-left: 4px solid var(--primary);
            padding: 14px; margin-bottom: 12px; border-radius: 10px; font-size: 0.88rem;
        }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px;
        }

        .metric-card {
            background: #fafafa; border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 6px; text-align: center;
        }

        .metric-card h4 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .metric-card .value { font-size: 0.9rem; font-weight: 700; }
        .metric-card .value.income { color: var(--success); }
        .metric-card .value.expense { color: var(--danger); }
        .metric-card .value.profit { color: var(--primary); }

        .link-box {
            background: #eef2ff; border: 1px dashed #6366f1;
            padding: 10px; border-radius: 8px; word-break: break-all; font-size: 0.8rem; margin-top: 8px; color: #4338ca;
        }

        .alert-error { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
        .alert-success { background: #d1fae5; color: #047857; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }

        .time-slots-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .time-slot-btn { padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; text-align: center; font-size: 0.85rem; cursor: pointer; }
        .time-slot-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel do Profissional</h2>
    <div class="subtitle" id="panel-subtitle">Gerencie seu perfil e agendamentos</div>

    <div id="error-msg" class="alert-error"></div>
    <div id="success-msg" class="alert-success"></div>

    <!-- TELA 1: LOGIN -->
    <div id="screen-login">
        <form id="login-form">
            <div class="form-group">
                <label for="login-phone">📱 Seu WhatsApp</label>
                <input type="tel" id="login-phone" required placeholder="(83) 9XXXX-XXXX">
            </div>
            <div class="form-group">
                <label for="login-pass">🔒 Senha</label>
                <input type="password" id="login-pass" required placeholder="Digite sua senha">
            </div>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer;">
                <input type="checkbox" id="remember-me" checked style="width: auto;">
                Lembrar de mim
            </label>
            <button type="submit" class="btn-action" style="margin-top: 15px;">Entrar no Painel</button>
        </form>
        <button type="button" class="btn-link" onclick="showScreen('register')">Não tem conta? Cadastre-se</button>
    </div>

    <!-- TELA 2: CADASTRO -->
    <div id="screen-register" class="hidden">
        <form id="register-form">
            <div class="form-group">
                <label for="reg-name">👤 Seu Nome Completo</label>
                <input type="text" id="reg-name" required placeholder="Ex: Maria Silva">
            </div>
            <div class="form-group">
                <label for="reg-phone">📱 WhatsApp</label>
                <input type="tel" id="reg-phone" required placeholder="(83) 9XXXX-XXXX">
            </div>
            <div class="form-group">
                <label for="reg-pass">🔒 Crie uma Senha</label>
                <input type="password" id="reg-pass" required placeholder="Mínimo 4 caracteres" minlength="4">
            </div>
            <button type="submit" class="btn-action">Criar Meu Perfil</button>
        </form>
        <button type="button" class="btn-link" onclick="showScreen('login')">Já tem conta? Voltar ao Login</button>
    </div>

    <!-- TELA 3: DASHBOARD -->
    <div id="screen-dashboard" class="hidden">
        <div class="metrics-grid">
            <div class="metric-card">
                <h4>Entradas</h4>
                <div class="value income" id="val-income">R$ 0,00</div>
            </div>
            <div class="metric-card">
                <h4>Saídas</h4>
                <div class="value expense" id="val-expense">R$ 0,00</div>
            </div>
            <div class="metric-card">
                <h4>Lucro</h4>
                <div class="value profit" id="val-profit">R$ 0,00</div>
            </div>
        </div>

        <div class="tab-buttons">
            <button id="tab-agenda-btn" class="tab-btn active" onclick="switchDashTab('agenda')">Agenda</button>
            <button id="tab-perfil-btn" class="tab-btn" onclick="switchDashTab('perfil')">Perfil & Local</button>
            <button id="tab-horarios-btn" class="tab-btn" onclick="switchDashTab('horarios')">Horários</button>
            <button id="tab-despesas-btn" class="tab-btn" onclick="switchDashTab('despesas')">Despesas</button>
            <button id="tab-link-btn" class="tab-btn" onclick="switchDashTab('link')">Meu Link</button>
        </div>

        <!-- ABA AGENDA -->
        <div id="dash-agenda">
            <div id="appointments-list"></div>
        </div>

        <!-- ABA PERFIL & ENDEREÇO -->
        <div id="dash-perfil" class="hidden">
            <form id="profile-form">
                <div class="form-group">
                    <label>📍 Modalidade de Atendimento</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="locationType" value="physical" onchange="toggleAddressInput()" checked>
                            Endereço Físico
                        </label>
                        <label>
                            <input type="radio" name="locationType" value="home" onchange="toggleAddressInput()">
                            Atendimento a Domicílio
                        </label>
                    </div>
                </div>

                <div class="form-group" id="address-group">
                    <label for="prof-address">🏬 Endereço Completo do Estabelecimento</label>
                    <input type="text" id="prof-address" placeholder="Ex: Av. Epitácio Pessoa, 1000, Sala 102 - Tambaú">
                </div>

                <button type="submit" class="btn-action">Salvar Configurações de Local</button>
            </form>
        </div>

        <!-- ABA HORÁRIOS -->
        <div id="dash-horarios" class="hidden">
            <label style="font-size:0.85rem; color:#555;">Clique para ativar/desativar os horários de atendimento:</label>
            <div class="time-slots-container" id="slots-grid"></div>
            <button type="button" class="btn-action" onclick="saveSlots()" style="margin-top:15px;">Salvar Horários</button>
        </div>

        <!-- ABA DESPESAS -->
        <div id="dash-despesas" class="hidden">
            <form id="expense-form" style="margin-bottom: 20px;">
                <div class="form-group">
                    <label>📝 Descrição</label>
                    <input type="text" id="exp-desc" required placeholder="Ex: Esmaltes, Aluguel">
                </div>
                <div class="form-group">
                    <label>💵 Valor (R$)</label>
                    <input type="number" step="0.01" id="exp-val" required placeholder="0,00">
                </div>
                <button type="submit" class="btn-action" style="background: var(--danger);">Lançar Despesa</button>
            </form>
            <div id="expenses-list"></div>
        </div>

        <!-- ABA LINK -->
        <div id="dash-link" class="hidden">
            <p style="font-size:0.88rem; color:#555; margin-bottom:8px;">Copie e envie este link para suas clientes:</p>
            <div class="link-box" id="prof-booking-link"></div>
            <button type="button" class="btn-action" onclick="copyBookingLink()" style="margin-top:10px;">Copiar Link</button>
        </div>

        <button type="button" class="btn-link" onclick="logout()" style="color:var(--danger); margin-top:20px;">Sair da Conta</button>
    </div>
</div>

<script>
    const defaultTimeSlots = ["08:00", "09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
    let loggedProf = null;

    function cleanPhoneNumber(phone) { return phone.replace(/\D/g, ''); }

    function showMsg(text, isError = false) {
        const errorEl = document.getElementById('error-msg');
        const successEl = document.getElementById('success-msg');
        errorEl.style.display = isError ? 'block' : 'none';
        successEl.style.display = isError ? 'none' : 'block';
        if (isError) errorEl.innerText = text; else successEl.innerText = text;
    }

    function clearMsgs() {
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('success-msg').style.display = 'none';
    }

    function showScreen(screen) {
        clearMsgs();
        document.getElementById('screen-login').classList.toggle('hidden', screen !== 'login');
        document.getElementById('screen-register').classList.toggle('hidden', screen !== 'register');
        document.getElementById('screen-dashboard').classList.toggle('hidden', screen !== 'dashboard');
    }

    function checkAutoLogin() {
        const savedProfId = localStorage.getItem('nail_active_session');
        if (savedProfId) {
            const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
            const prof = professionals.find(p => p.id === savedProfId);
            if (prof) {
                loggedProf = prof;
                showScreen('dashboard');
                loadDashboard();
                return;
            }
        }
        showScreen('login');
    }

    // ALTERAR CAMPO DE ENDEREÇO DEPENDENDO DA SELEÇÃO
    function toggleAddressInput() {
        const locationType = document.querySelector('input[name="locationType"]:checked').value;
        const addressGroup = document.getElementById('address-group');
        const addressInput = document.getElementById('prof-address');

        if (locationType === 'home') {
            addressGroup.style.display = 'none';
            addressInput.removeAttribute('required');
        } else {
            addressGroup.style.display = 'block';
            addressInput.setAttribute('required', 'true');
        }
    }

    // SALVAR PERFIL E ENDEREÇO
    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const locationType = document.querySelector('input[name="locationType"]:checked').value;
        const address = document.getElementById('prof-address').value.trim();

        if (locationType === 'physical' && !address) {
            showMsg('Por favor, digite o endereço do seu estabelecimento.', true);
            return;
        }

        loggedProf.locationType = locationType;
        loggedProf.address = locationType === 'physical' ? address : 'Atendimento a Domicílio';

        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        const idx = professionals.findIndex(p => p.id === loggedProf.id);
        if (idx !== -1) {
            professionals[idx] = loggedProf;
            localStorage.setItem('nail_professionals', JSON.stringify(professionals));
            showMsg('Configurações de local salvas!');
        }
    });

    // LOGIN
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const cleanPhone = cleanPhoneNumber(document.getElementById('login-phone').value);
        const pass = document.getElementById('login-pass').value;
        const rememberMe = document.getElementById('remember-me').checked;

        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        const prof = professionals.find(p => cleanPhoneNumber(p.phone) === cleanPhone && p.pass === pass);

        if (!prof) {
            showMsg('WhatsApp ou senha incorretos!', true);
            return;
        }

        loggedProf = prof;
        if (rememberMe) localStorage.setItem('nail_active_session', prof.id);
        else localStorage.removeItem('nail_active_session');

        showScreen('dashboard');
        loadDashboard();
    });

    // CADASTRO
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const cleanPhone = cleanPhoneNumber(document.getElementById('reg-phone').value);
        const pass = document.getElementById('reg-pass').value;

        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        if (professionals.some(p => cleanPhoneNumber(p.phone) === cleanPhone)) {
            showMsg('WhatsApp já cadastrado!', true);
            return;
        }

        const newProf = {
            id: 'prof_' + Date.now(),
            name: name,
            phone: cleanPhone,
            pass: pass,
            locationType: 'physical',
            address: '',
            availableSlots: [...defaultTimeSlots],
            services: [
                { name: "Manicure Tradicional", price: 35 },
                { name: "Esmaltação em Gel", price: 60 },
                { name: "Alongamento", price: 120 }
            ]
        };

        professionals.push(newProf);
        localStorage.setItem('nail_professionals', JSON.stringify(professionals));
        loggedProf = newProf;
        localStorage.setItem('nail_active_session', newProf.id);

        showScreen('dashboard');
        loadDashboard();
    });

    function switchDashTab(tab) {
        document.getElementById('dash-agenda').classList.toggle('hidden', tab !== 'agenda');
        document.getElementById('dash-perfil').classList.toggle('hidden', tab !== 'perfil');
        document.getElementById('dash-horarios').classList.toggle('hidden', tab !== 'horarios');
        document.getElementById('dash-despesas').classList.toggle('hidden', tab !== 'despesas');
        document.getElementById('dash-link').classList.toggle('hidden', tab !== 'link');

        document.getElementById('tab-agenda-btn').classList.toggle('active', tab === 'agenda');
        document.getElementById('tab-perfil-btn').classList.toggle('active', tab === 'perfil');
        document.getElementById('tab-horarios-btn').classList.toggle('active', tab === 'horarios');
        document.getElementById('tab-despesas-btn').classList.toggle('active', tab === 'despesas');
        document.getElementById('tab-link-btn').classList.toggle('active', tab === 'link');
    }

    function calculateFinances() {
        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        const expenses = JSON.parse(localStorage.getItem('nail_expenses') || '[]');

        const income = appointments.filter(a => a.profId === loggedProf.id && a.status === 'completed').reduce((s, a) => s + (parseFloat(a.price) || 0), 0);
        const expense = expenses.filter(e => e.profId === loggedProf.id).reduce((s, e) => s + (parseFloat(e.value) || 0), 0);

        document.getElementById('val-income').innerText = `R$ ${income.toFixed(2).replace('.', ',')}`;
        document.getElementById('val-expense').innerText = `R$ ${expense.toFixed(2).replace('.', ',')}`;
        document.getElementById('val-profit').innerText = `R$ ${(income - expense).toFixed(2).replace('.', ',')}`;
    }

    function loadDashboard() {
        if (!loggedProf) return;

        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        document.getElementById('prof-booking-link').innerText = `${baseUrl}/index.html?prof=${loggedProf.id}`;

        // Carrega configurações de Local
        const isHome = loggedProf.locationType === 'home';
        document.querySelectorAll('input[name="locationType"]').forEach(r => r.checked = (r.value === (isHome ? 'home' : 'physical')));
        document.getElementById('prof-address').value = loggedProf.address || '';
        toggleAddressInput();

        calculateFinances();
        renderSlotsConfig();
        loadAppointments();
    }

    function renderSlotsConfig() {
        const grid = document.getElementById('slots-grid');
        const activeSlots = loggedProf.availableSlots || defaultTimeSlots;
        grid.innerHTML = defaultTimeSlots.map(time => `
            <div class="time-slot-btn ${activeSlots.includes(time) ? 'active' : ''}" onclick="this.classList.toggle('active')">
                ${time}
            </div>
        `).join('');
    }

    function saveSlots() {
        const activeEls = document.querySelectorAll('.time-slot-btn.active');
        loggedProf.availableSlots = Array.from(activeEls).map(el => el.innerText.trim());

        const professionals = JSON.parse(localStorage.getItem('nail_professionals') || '[]');
        const idx = professionals.findIndex(p => p.id === loggedProf.id);
        if (idx !== -1) {
            professionals[idx] = loggedProf;
            localStorage.setItem('nail_professionals', JSON.stringify(professionals));
            showMsg('Horários salvos!');
        }
    }

    function loadAppointments() {
        const appointments = JSON.parse(localStorage.getItem('nail_appointments') || '[]');
        const listEl = document.getElementById('appointments-list');
        const profAppointments = appointments.filter(a => a.profId === loggedProf.id);

        if (profAppointments.length === 0) {
            listEl.innerHTML = '<p style="text-align: center; color: #777;">Nenhum agendamento.</p>';
            return;
        }

        listEl.innerHTML = profAppointments.map(app => {
            const [date, time] = app.datetime.split('T');
            const [year, month, day] = date.split('-');
            return `
                <div class="card">
                    <strong>Cliente:</strong> ${app.client}<br>
                    <strong>WhatsApp:</strong> ${app.phone}<br>
                    <strong>Serviço:</strong> ${app.service}<br>
                    <strong>Data:</strong> ${day}/${month}/${year} às ${time} hs
                </div>
            `;
        }).join('');
    }

    function copyBookingLink() {
        navigator.clipboard.writeText(document.getElementById('prof-booking-link').innerText).then(() => alert('Link copiado!'));
    }

    function logout() {
        localStorage.removeItem('nail_active_session');
        loggedProf = null;
        showScreen('login');
    }

    checkAutoLogin();
</script>
</body>
</html>
