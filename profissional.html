<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <!-- LOGIN -->
    <div id="pro-login-view">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h3 class="text-center mb-4 text-danger fw-bold">Login Profissional</h3>
                    <input type="text" id="login-phone" class="form-control mb-2" placeholder="Telefone (apenas números)">
                    <input type="password" id="login-pass" class="form-control mb-3" placeholder="Senha">
                    <button onclick="proLogin()" class="btn btn-danger w-100 mb-2">Entrar</button>
                    <button onclick="navigate('pro-register-view')" class="btn btn-link w-100 btn-sm text-secondary">Criar nova conta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CADASTRO -->
    <div id="pro-register-view" style="display:none;">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h3 class="text-center mb-4 text-danger fw-bold">Novo Cadastro</h3>
                    <input type="text" id="reg-name" class="form-control mb-2" placeholder="Nome Completo">
                    <input type="text" id="reg-phone" class="form-control mb-2" placeholder="Telefone (apenas números)">
                    <input type="text" id="reg-address" class="form-control mb-2" placeholder="Endereço de Atendimento">
                    <input type="password" id="reg-pass" class="form-control mb-3" placeholder="Senha">
                    <button onclick="proRegister()" class="btn btn-success w-100 mb-2">Cadastrar</button>
                    <button onclick="navigate('pro-login-view')" class="btn btn-link w-100 btn-sm text-secondary">Voltar ao Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="pro-dashboard-view" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 id="welcome-user" class="fw-bold text-danger">Painel do Profissional</h3>
            <button onclick="proLogout()" class="btn btn-outline-danger btn-sm">Sair</button>
        </div>

        <!-- LINK PARA CLIENTE -->
        <div class="card p-3 shadow-sm mb-4 bg-white">
            <h6 class="fw-bold">Seu Link de Agendamento:</h6>
            <small id="pro-share-link" class="text-primary fw-bold d-block mb-2"></small>
            <div>
                <button onclick="copyLink()" class="btn btn-sm btn-outline-primary">Copiar Link</button>
            </div>
        </div>

        <!-- GERENCIAR SERVIÇOS -->
        <div class="card p-3 shadow-sm mb-4">
            <h5 class="fw-bold mb-3">Serviços e Preços</h5>
            <div class="row g-2 mb-3">
                <div class="col-md-6"><input type="text" id="service-name" class="form-control" placeholder="Nome do serviço"></div>
                <div class="col-md-4"><input type="number" id="service-price" class="form-control" placeholder="Preço (R$)"></div>
                <div class="col-md-2"><button onclick="addService()" class="btn btn-success w-100">Adicionar</button></div>
            </div>
            <ul id="services-list" class="list-group"></ul>
        </div>

        <!-- GERENCIAR HORÁRIOS -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">Abrir Horários</h5>
                    <div class="row g-2 mb-3">
                        <div class="col"><input type="date" id="slot-date" class="form-control"></div>
                        <div class="col"><input type="time" id="slot-time" class="form-control"></div>
                        <div class="col-auto"><button onclick="addTimeSlot()" class="btn btn-success"><i class="fa-solid fa-plus"></i></button></div>
                    </div>
                    <ul id="slots-list" class="list-group"></ul>
                </div>
            </div>

            <!-- LISTA DE AGENDAMENTOS -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">Agendamentos Recebidos</h5>
                    <div id="pro-bookings-list"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zvxcakqpbrpfdsvhuhbh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_41upAZ0wW1NC4i3zTnkU9Q_gF8Tc4Ry';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function navigate(viewId) {
    ['pro-login-view', 'pro-register-view', 'pro-dashboard-view'].forEach(v => {
        document.getElementById(v).style.display = (v === viewId) ? 'block' : 'none';
    });
}

function proRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const address = document.getElementById('reg-address').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();

    if(!name || !phone || !pass) return alert("Preencha os campos obrigatórios!");

    let users = JSON.parse(localStorage.getItem('pro_users') || '[]');
    if(users.some(u => u.phone === phone)) return alert("Telefone já cadastrado!");

    users.push({ name, phone, address, pass });
    localStorage.setItem('pro_users', JSON.stringify(users));
    alert("Cadastrado com sucesso!");
    navigate('pro-login-view');
}

function proLogin() {
    const phone = document.getElementById('login-phone').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    const users = JSON.parse(localStorage.getItem('pro_users') || '[]');
    
    const user = users.find(u => u.phone === phone && u.pass === pass);
    if(user) {
        localStorage.setItem('active_pro_user', phone);
        loadDashboard();
        navigate('pro-dashboard-view');
    } else {
        alert("Telefone ou senha incorretos!");
    }
}

function proLogout() {
    localStorage.removeItem('active_pro_user');
    navigate('pro-login-view');
}

async function loadDashboard() {
    const phone = localStorage.getItem('active_pro_user');
    const users = JSON.parse(localStorage.getItem('pro_users') || '[]');
    const user = users.find(u => u.phone === phone);

    if(!user) return;
    document.getElementById('welcome-user').innerText = `Olá, ${user.name}`;

    const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    document.getElementById('pro-share-link').innerText = `${basePath}/cliente.html?pro=${phone}`;

    renderServices();
    renderSlots();
    renderBookings();
}

function copyLink() {
    const linkText = document.getElementById('pro-share-link').innerText;
    navigator.clipboard.writeText(linkText);
    alert("Link copiado para a área de transferência!");
}

async function addService() {
    const phone = localStorage.getItem('active_pro_user');
    const name = document.getElementById('service-name').value.trim();
    const price = parseFloat(document.getElementById('service-price').value || 0);

    if(!name || price <= 0) return alert("Insira um nome e preço válido!");

    await _supabase.from('servicos').insert([{ pro_id: phone, nome: name, preco: price, active: true }]);
    document.getElementById('service-name').value = '';
    document.getElementById('service-price').value = '';
    renderServices();
}

async function renderServices() {
    const phone = localStorage.getItem('active_pro_user');
    const list = document.getElementById('services-list');
    
    let { data: servs } = await _supabase.from('servicos').select('*').eq('pro_id', phone);
    
    if(!servs || servs.length === 0) {
        list.innerHTML = '<li class="list-group-item text-muted">Nenhum serviço cadastrado.</li>';
        return;
    }

    list.innerHTML = servs.map(s => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span><strong>${s.nome}</strong> - R$ ${parseFloat(s.preco).toFixed(2)}</span>
            <button onclick="deleteService(${s.id})" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
        </li>
    `).join('');
}

async function deleteService(id) {
    await _supabase.from('servicos').delete().eq('id', id);
    renderServices();
}

async function addTimeSlot() {
    const phone = localStorage.getItem('active_pro_user');
    const date = document.getElementById('slot-date').value;
    const time = document.getElementById('slot-time').value;

    if(!date || !time) return alert("Selecione data e hora!");

    const texto = `${date.split('-').reverse().join('/')} às ${time}`;
    await _supabase.from('horarios_disponiveis').insert([{ pro_id: phone, data: date, hora: time, texto: texto, booked: false }]);

    renderSlots();
}

async function renderSlots() {
    const phone = localStorage.getItem('active_pro_user');
    const list = document.getElementById('slots-list');

    let { data: slots } = await _supabase.from('horarios_disponiveis').select('*').eq('pro_id', phone).eq('booked', false);

    if(!slots || slots.length === 0) {
        list.innerHTML = '<li class="list-group-item text-muted">Nenhum horário aberto.</li>';
        return;
    }

    list.innerHTML = slots.map(s => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>${s.texto || s.data + ' às ' + s.hora}</span>
            <button onclick="deleteSlot(${s.id})" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
        </li>
    `).join('');
}

async function deleteSlot(id) {
    await _supabase.from('horarios_disponiveis').delete().eq('id', id);
    renderSlots();
}

async function renderBookings() {
    const phone = localStorage.getItem('active_pro_user');
    const container = document.getElementById('pro-bookings-list');

    let { data: bookings } = await _supabase.from('agendamentos').select('*').eq('pro_id', phone);

    if(!bookings || bookings.length === 0) {
        container.innerHTML = '<p class="text-muted">Nenhum agendamento realizado ainda.</p>';
        return;
    }

    container.innerHTML = bookings.map(b => `
        <div class="card mb-2 p-3 border-start border-4 border-danger shadow-sm">
            <h6 class="fw-bold text-danger mb-1">${b.nome || 'Cliente'}</h6>
            <p class="mb-1"><strong>Tel:</strong> ${b.telefone || 'N/A'}</p>
            <p class="mb-1"><strong>Serviço:</strong> ${b.servico} - <span class="text-success fw-bold">R$ ${parseFloat(b.valor || 0).toFixed(2)}</span></p>
            <small class="text-primary fw-bold">Data/Hora: ${b.horario}</small>
        </div>
    `).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    if(localStorage.getItem('active_pro_user')) {
        loadDashboard();
        navigate('pro-dashboard-view');
    } else {
        navigate('pro-login-view');
    }
});
</script>
</body>
</html>
