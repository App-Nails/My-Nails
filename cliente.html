<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Colocar dentro da tag <head> -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Nail Designer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-user-select: none; user-select: none; }
        .card-custom { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-pink { background-color: #e83e8c; color: white; }
        .btn-pink:hover { background-color: #d63384; color: white; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container py-4">
    <div class="card card-custom p-4 mx-auto" style="max-width: 600px;">
        <h3 class="text-center mb-3 text-pink">💅 Agende seu Horário</h3>
        
        <!-- FORMULÁRIO DE AGENDAMENTO -->
        <div id="booking-form-area">
            <div class="mb-3">
                <label class="form-label">Seu Nome</label>
                <input type="text" id="client-name" class="form-control" placeholder="Digite seu nome completo">
            </div>
            <div class="mb-3">
                <label class="form-label">Seu Telefone</label>
                <input type="tel" id="client-phone" class="form-control" placeholder="Apenas números">
            </div>
            <div class="mb-3">
                <label class="form-label">Selecione o Serviço</label>
                <select id="client-service-select" class="form-select"></select>
            </div>
            <div class="mb-3">
                <label class="form-label">Horários Disponíveis</label>
                <select id="client-slot-select" class="form-select"></select>
            </div>
            <button onclick="saveBooking()" class="btn btn-pink w-100">Salvar Agendamento</button>
        </div>

        <hr class="my-4">

        <!-- MINHAS CONSULTAS -->
        <div>
            <h5>Consultar Meus Agendamentos</h5>
            <div class="input-group mb-3">
                <input type="tel" id="search-client-phone" class="form-control" placeholder="Digite seu telefone">
                <button onclick="loadClientBookings()" class="btn btn-outline-secondary">Buscar</button>
            </div>
            <ul id="client-bookings-list" class="list-group"></ul>
        </div>
    </div>
</div>

<script>
    // Configuração da conexão com o Supabase
const SUPABASE_URL = 'https://zvxcakqpbrpfdsvhuhbh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_41upAZ0wW1NC4i3zTnkU9Q_gF8Tc4Ry';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Substitua a sua antiga função saveBooking por esta:
async function saveBooking() {
  const name = document.getElementById('client-name').value;
  const phone = document.getElementById('client-phone').value;
  const service = document.getElementById('client-service-select').value;
  const slot = document.getElementById('client-slot-select').value;

  const urlParams = new URLSearchParams(window.location.search);
  const proId = urlParams.get('pro');

  if (!name || !phone || !service || !slot) {
    alert('Por favor, preencha todos os campos!');
    return;
  }

  const { data, error } = await _supabase
    .from('agendamentos')
    .insert([
      { 
        nome: name, 
        telefone: phone, 
        servico: service, 
        horario: slot, 
        pro_id: proId 
      }
    ]);

  if (error) {
    console.error('Erro no Supabase:', error);
    alert('Erro ao realizar o agendamento: ' + error.message);
  } else {
    alert('Agendamento realizado com sucesso!');
    document.getElementById('client-name').value = '';
    document.getElementById('client-phone').value = '';
  }
}
function getDB(key) { return JSON.parse(localStorage.getItem(key)) || []; }
function setDB(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

window.onload = function() {
    setupSecurityProtections();
    loadClientView();
    startNotificationLoop();
};

function loadClientView() {
    const urlParams = new URLSearchParams(window.location.search);
    const proPhone = urlParams.get('pro') || (getDB('pro_users')[0] ? getDB('pro_users')[0].phone : null);

    if (!proPhone) {
        alert("Nenhum profissional cadastrado no sistema.");
        return;
    }

    const pro = getDB('pro_users').find(u => u.phone === proPhone);
    if (!pro) return;

    // Carrega serviços
    const serviceSelect = document.getElementById('client-service-select');
    serviceSelect.innerHTML = pro.services.map(s => `<option value="${s.name}" data-price="${s.price}">${s.name} - R$ ${s.price.toFixed(2)}</option>`).join('');

    // Carrega horários disponíveis
    const slotSelect = document.getElementById('client-slot-select');
    const availableSlots = getDB('slots').filter(s => s.proPhone === proPhone && !s.booked);
    slotSelect.innerHTML = availableSlots.length > 0 
        ? availableSlots.map(s => `<option value="${s.id}">${s.date.split('-').reverse().join('/')} às ${s.time}</option>`).join('')
        : '<option value="">Nenhum horário disponível</option>';
}

async function saveBooking() {
  const name = document.getElementById('client-name').value;
  const phone = document.getElementById('client-phone').value;
  const service = document.getElementById('client-service-select').value;
  const slot = document.getElementById('client-slot-select').value;

  const urlParams = new URLSearchParams(window.location.search);
  const proId = urlParams.get('pro');

  if (!name || !phone || !service || !slot) {
    alert('Por favor, preencha todos os campos!');
    return;
  }

  const { data, error } = await _supabase
    .from('agendamentos')
    .insert([
      { 
        nome: name, 
        telefone: phone, 
        servico: service, 
        horario: slot, 
        pro_id: proId 
      }
    ]);

  if (error) {
    console.error('Erro no Supabase:', error);
    alert('Erro ao realizar o agendamento: ' + error.message);
  } else {
    alert('Agendamento realizado com sucesso!');
    document.getElementById('client-name').value = '';
    document.getElementById('client-phone').value = '';
  }
}

function loadClientBookings() {
    const phone = document.getElementById('search-client-phone').value.trim();
    const bookings = getDB('bookings').filter(b => b.clientPhone === phone);

    document.getElementById('client-bookings-list').innerHTML = bookings.length > 0
        ? bookings.map(b => `
            <li class="list-group-item">
                <strong>${b.serviceName}</strong> - ${b.slotDate.split('-').reverse().join('/')} às ${b.slotTime}
                <br><small class="text-muted">Valor: R$ ${b.price.toFixed(2)}</small>
            </li>
        `).join('')
        : '<li class="list-group-item text-muted">Nenhum agendamento encontrado.</li>';
}

function startNotificationLoop() {
    setInterval(() => {
        const bookings = getDB('bookings');
        const now = new Date();

        bookings.forEach(b => {
            const bookingTime = new Date(`${b.slotDate}T${b.slotTime}`);
            const diffMinutes = Math.floor((bookingTime - now) / 60000);

            if (diffMinutes <= 30 && diffMinutes > 29 && !b.clientNotified) {
                alert(`[NOTIFICAÇÃO] Faltam 30 minutos para o seu agendamento de ${b.serviceName}!`);
                b.clientNotified = true;
            }
        });

        setDB('bookings', bookings);
    }, 10000);
}

function setupSecurityProtections() {
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
}
</script>
</body>
</html>
