<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Horário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center mb-4 text-danger fw-bold">Agende seu Horário</h3>

                <form onsubmit="realizarAgendamento(event)">
                    <div class="mb-3">
                        <label class="form-label">Seu Nome</label>
                        <input type="text" id="cli-nome" class="form-control" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Seu Telefone / WhatsApp</label>
                        <input type="text" id="cli-telefone" class="form-control" placeholder="DDD + Número" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Selecione o Serviço</label>
                        <select id="cli-servico" class="form-select" required>
                            <option value="">Carregando serviços...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Selecione o Horário Disponível</label>
                        <select id="cli-horario" class="form-select" required>
                            <option value="">Carregando horários...</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-agendar" class="btn btn-danger w-100 fw-bold">Confirmar Agendamento</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zvxcakqpbrpfdsvhuhbh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_41upAZ0wW1NC4i3zTnkU9Q_gF8Tc4Ry';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const urlParams = new URLSearchParams(window.location.search);
const proPhone = urlParams.get('pro');

async function carregarDados() {
    if(!proPhone) {
        alert("Link de agendamento inválido ou incompleto!");
        return;
    }

    // CARREGAR SERVIÇOS
    const { data: servicos } = await _supabase.from('servicos').select('*').eq('pro_id', proPhone).eq('active', true);
    const selectServico = document.getElementById('cli-servico');
    
    if(servicos && servicos.length > 0) {
        selectServico.innerHTML = '<option value="">-- Escolha um Serviço --</option>' + 
            servicos.map(s => `<option value="${s.nome}" data-preco="${s.preco}">${s.nome} - R$ ${parseFloat(s.preco).toFixed(2)}</option>`).join('');
    } else {
        selectServico.innerHTML = '<option value="">Nenhum serviço disponível</option>';
    }

    // CARREGAR HORÁRIOS DISPONÍVEIS
    const { data: horarios } = await _supabase.from('horarios_disponiveis').select('*').eq('pro_id', proPhone).eq('booked', false);
    const selectHorario = document.getElementById('cli-horario');

    if(horarios && horarios.length > 0) {
        selectHorario.innerHTML = '<option value="">-- Escolha um Horário --</option>' + 
            horarios.map(h => `<option value="${h.texto || (h.data + ' às ' + h.hora)}" data-id="${h.id}">${h.texto || (h.data + ' às ' + h.hora)}</option>`).join('');
    } else {
        selectHorario.innerHTML = '<option value="">Nenhum horário livre no momento</option>';
    }
}

async function realizarAgendamento(event) {
    event.preventDefault();

    const btn = document.getElementById('btn-agendar');
    btn.disabled = true;
    btn.innerText = "Agendando...";

    const nome = document.getElementById('cli-nome').value.trim();
    const telefone = document.getElementById('cli-telefone').value.trim();
    const selectServico = document.getElementById('cli-servico');
    const selectHorario = document.getElementById('cli-horario');

    const servicoNome = selectServico.value;
    const servicoPreco = parseFloat(selectServico.options[selectServico.selectedIndex].getAttribute('data-preco') || 0);
    
    const horarioTexto = selectHorario.value;
    const horarioId = selectHorario.options[selectHorario.selectedIndex].getAttribute('data-id');

    if(!servicoNome || !horarioTexto) {
        alert("Por favor selecione serviço e horário válidos.");
        btn.disabled = false;
        btn.innerText = "Confirmar Agendamento";
        return;
    }

    // 1. GRAVAR O AGENDAMENTO NO SUPABASE
    const { error: errAgendamento } = await _supabase.from('agendamentos').insert([{
        pro_id: proPhone,
        nome: nome,
        telefone: telefone,
        servico: servicoNome,
        valor: servicoPreco,
        horario: horarioTexto
    }]);

    if(errAgendamento) {
        alert("Erro ao realizar o agendamento no sistema. Tente novamente.");
        btn.disabled = false;
        btn.innerText = "Confirmar Agendamento";
        return;
    }

    // 2. MARCAR O HORÁRIO COMO OCUPADO
    if(horarioId) {
        await _supabase.from('horarios_disponiveis').update({ booked: true }).eq('id', horarioId);
    }

    alert("Agendamento realizado com sucesso!");
    window.location.reload();
}

document.addEventListener('DOMContentLoaded', carregarDados);
</script>
</body>
</html>
